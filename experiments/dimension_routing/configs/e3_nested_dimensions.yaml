experiment:
  name: e3_nested_dimensions
  dimension_mode: nested
  tolerance: 0.01

model:
  name: tinybert_6l
  embedding_dim: 768
  max_length: 256

data:
  training_csv: data/final_data.csv

training:
  epochs: 1
  learning_rate: 0.00002
  warmup_ratio: 0.10
  weight_decay: 0.01
  temperature: 0.05
  max_grad_norm: 1.0
  examples_per_task_per_batch: 4
  batch_size: 28
  seeds:
    - 42
    - 123
    - 456

objective:
  mode: global
  loss_reduction: mean

dimensions:
  nested_dims:
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 768

evaluation:
  classification_metric: macro_f1
  similarity_metric: spearman
  evaluate_all_prefixes: true
  tune_c: true
