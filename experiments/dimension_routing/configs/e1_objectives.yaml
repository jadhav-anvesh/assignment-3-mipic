experiment:
  name: e1_objective_comparison
  dimension_mode: disjoint

model:
  name: tinybert_6l
  embedding_dim: 768
  max_length: 256

data:
  training_csv: data/final_data.csv

training:
  epochs: 1
  learning_rate: 0.00002
  warmup_ratio: 0.10
  weight_decay: 0.01
  temperature: 0.05
  max_grad_norm: 1.0
  examples_per_task_per_batch: 4
  batch_size: 28
  seeds:
    - 42
    - 123
    - 456

objective:
  # The six non-overlapping E1 conditions:
  # C1: global (all 28 queries, all 27 negatives)
  # C2: query_masked (4 assigned queries, all 27 negatives)
  # C3: task_isolated (4 assigned queries, 3 same-task negatives)
  # C4: global_matched_query (4 mixed queries across tasks, all 27 negatives)
  # C5: query_masked_cross_k3 (4 assigned queries, 3 cross-task negatives)
  # C6: query_masked_mixed_k3 (4 assigned queries, 3 negatives sampled from full 27 pool)
  modes:
    - global
    - query_masked
    - task_isolated
    - global_matched_query
    - query_masked_cross_k3
    - query_masked_mixed_k3
  loss_reduction: mean

dimensions:
  blocks:
    - [0, 16]
    - [16, 32]
    - [32, 64]
    - [64, 128]
    - [128, 256]
    - [256, 512]
    - [512, 768]

assignment:
  TWEET_EVAL_SENT: 0
  BANKING77: 1
  MRPC: 2
  DEEHAN1866/WIC: 3
  DGEM_FORMAT: 4
  SICK: 5
  STSB: 6

evaluation:
  classification_metric: macro_f1
  similarity_metric: spearman
  evaluate_all_blocks: true
  tune_c: false
